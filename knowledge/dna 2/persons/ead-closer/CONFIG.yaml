# Síntese narrativa
sintese_narrativa: |
  EAD Closer é um curso brasileiro de vendas high-ticket que combina
  técnicas internacionais (SPIN, DISC, PNL) com contexto de mercado brasileiro.

  FILOSOFIA CORE: Vender é um ato de amor — só venda o que acredita que
  vai transformar a vida da pessoa. Emoção decide, lógica justifica.

  METODOLOGIAS SIGNATURE:
  - SPIN Selling Adaptado: Situação → Problema → Implicação → Necessidade
  - BITs (Believe Implants): Pequenas crenças instaladas no pré-pitch
  - Value Stacking B2C: Âncora de valor + revelação do preço real
  - Cenário A vs B: Contraste Inferno/Céu para motivar decisão
  - Micropactos Progressivos: Ladder de compromissos pequenos
  - Warm-Up PRS: Pergunta → Resposta → Suporte (anti-interrogatório)
  - FORM: Família → Ocupação → Recreação → Motivação

  MODELO DE TIME: SDR (aquece) → Closer (fecha) → CS (retém)
  COMISSÃO: 5-30% dependendo do tipo de produto (info/serviço/físico)

  MÉTRICAS DE REFERÊNCIA:
  - 7% webinário vs 93% closer (importância do vendedor humano)
  - Pitch padronizado: 97-98% do conteúdo igual, 2-3% personalizado
  - 20min diagnóstico / 40min pitch / 20min fechamento (estrutura ideal)
  - R$20k treinamento → R$408k retorno (ROI exemplo)
  - 3:1 ratio positivo/negativo em feedback de liderança

