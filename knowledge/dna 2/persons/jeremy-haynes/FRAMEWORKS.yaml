  - id: "JH-FW-009"
    titulo: "Pentagon Solution - 5-Area AI Reputation Attack"
    descricao: |
      Framework para construção proativa de reputação digital em 5 frentes
      simultâneas usando IA. O objetivo é dominar o espaço de busca e social proof
      para que prospects que pesquisam sobre a agência/oferta encontrem credibilidade
      em múltiplos canais independentes. As 5 áreas formam um pentágono de autoridade.
    peso: 0.97
    componentes:
      - "Reddit: presença e autoridade em comunidades relevantes"
      - "Trustpilot: gestão proativa de avaliações e reviews"
      - "Press: cobertura em publicações relevantes do setor"
      - "Blogs: conteúdo SEO em sites de autoridade do nicho"
      - "Authority Content: podcasts, entrevistas, guest posts em plataformas de referência"
    aplicacao: "Quando escalar beyond $50K/mês - reputação online se torna gargalo de conversão"
    dominios:
      - "reputação"
      - "autoridade"
      - "marketing de conteúdo"
    fontes: ["CONFIG"]

  # ═══════════════════════════════════════════════════════════════
  # TEAM & OPERATIONS FRAMEWORKS
  # ═══════════════════════════════════════════════════════════════

  - id: "JH-FW-010"
    titulo: "Cleaner Role Framework - Estrutura de Recuperação de Leads"
    descricao: |
      Sistema para recuperar leads abandonados que nenhum closer está seguindo.
      O Cleaner é um closing role (não setter) que entra especificamente para
      reativar leads de semanas anteriores. Progressão de carreira: Cleaner →
      Setter ou Closer. Introduzir na semana 2-3 de campanha, antes que o
      problema se torne matematicamente irrecuperável.
    peso: 0.96
    componentes:
      - "Perfil: closer em treinamento (não setter), responsável por leads abandonados"
      - "Função: reestabelecer comunicação com leads que não estão sendo seguidos"
      - "Autoridade: toma ownership total dos leads atribuídos (não devolve para closers)"
      - "Progressão: Cleaner → Setter ou Closer após demonstrar performance"
      - "KPI: taxas de recontato e conversão de leads 'frios'"
    aplicacao: "Equipes com 2+ semanas de campanha ativa e 2+ closers"
    dominios:
      - "estrutura de equipe"
      - "vendas"
      - "recuperação de receita"
    fontes: ["JH-ST-0005", "JH-ST-0004"]

  - id: "JH-FW-011"
    titulo: "4 Sales Team Structures - Decisão por Volume de Leads"
    descricao: |
      Framework de decisão para estruturar equipe de vendas baseado no volume
      de leads diários e capacidade operacional do closer. Quatro modelos possíveis:
      (1) Closer Solo (baixo volume), (2) Closer + Cleaner (volume médio crescendo),
      (3) Setter + Closer (alto volume, pre-qualificação necessária),
      (4) Setter + Closer + Cleaner (alta escala, máxima cobertura).
    peso: 0.95
    componentes:
      - "Closer Solo: viável até semana 2-3 de campanha ativa"
      - "Closer + Cleaner: quando 3 pilares de atividade começam a conflitar"
      - "Setter + Closer: quando volume excede capacidade do closer solo"
      - "Setter + Closer + Cleaner: modelo completo para alta escala"
      - "Critério de transição: qualquer pilar (leads diários, agendados, follow-up) comprometido"
    aplicacao: "Ao estruturar ou reestruturar equipe de vendas baseada em volume atual"
    dominios:
      - "estrutura de equipe"
      - "vendas"
      - "escala"
    fontes: ["JH-ST-0004", "JH-ST-0005"]

  - id: "JH-FW-012"
    titulo: "Staff vs Contractors vs Strategic Referral Network Decision Matrix"
    descricao: |
      Framework para decisão de como construir a operação da agência. Três opções
      com trade-offs claros: Staff (máximo controle, máxima liability e custo),
      Contractors (controle moderado, margem alta, sem liability trabalhista),
      Strategic Referral Network (controle mínimo, margem menor, zero liability de entrega).
      Recomendação JH: contractors + referral network, nunca staff.
    peso: 0.94
    componentes:
      - "Staff: W2/CLT, paga benefícios + impostos + overhead - usar apenas em último caso"
      - "Contractors: pay per project, sem benefits, foco em resultados - modelo principal"
      - "Referral Network: 10-20% kickback, zero responsabilidade de entrega"
      - "Plataforma recomendada: Upwork.com para encontrar contractors qualificados"
      - "Nunca pagar por hora - sempre por projeto/resultado"
    aplicacao: "Decisão de qualquer nova contratação ou parceria na agência"
    dominios:
      - "operações de agência"
      - "estrutura de equipe"
      - "gestão financeira"
    fontes: ["AOBA-0004"]

  - id: "JH-FW-013"
    titulo: "AOV Optimization Framework - Incentive-Driven Pricing Structure"
    descricao: |
      Framework para maximizar Average Order Value através de estrutura de incentivos
      que direcionam comportamento de compra. Princípio central: bônus para full pay,
      penalidades para split pay, financing partners como terceira opção equiparada.
      O objetivo é coletar o máximo possível no ato da venda para maximizar ROI
      de marketing e capacidade de escala.
    peso: 0.95
    componentes:
      - "Full Pay: menor preço + todos os bônus disponíveis"
      - "Split Pay (2x): preço 4-5% maior + sem bônus"
      - "Financing Partners (Coach Finance, Finnfi): equiparado ao full pay em incentivos"
      - "Eliminar quad pay (4x) - alto churn por falha de pagamentos recorrentes"
      - "Regra: incentivos devem ser suficientemente poderosos para influenciar decisão"
    aplicacao: "Estruturação de opções de pagamento para qualquer oferta high-ticket"
    dominios:
      - "pricing"
      - "AOV"
      - "estrutura de pagamento"
    fontes: ["JH-ST-0013"]

  # ═══════════════════════════════════════════════════════════════
  # ACCOUNT MANAGEMENT FRAMEWORKS
  # ═══════════════════════════════════════════════════════════════

  - id: "JH-FW-014"
    titulo: "Share of Wallet Framework - Retention, Growth, Acquisition"
    descricao: |
      Framework de account management (adaptado da Dell) que classifica clientes
      em três categorias para priorização de esforço e estratégia. Retention: cliente
      já entrega 50%+ do wallet, foco em proteger e manter. Growth: cliente com
      potencial de expandir share, foco em upsell e cross-sell. Acquisition: cliente
      novo ou baixo share, foco em provar valor inicial.
    peso: 0.93
    componentes:
      - "Retention (50%+ wallet share): defender conta, superar expectativas, evitar churn"
      - "Growth (<50% com potencial): mapeamento de outras necessidades, apresentação de novos serviços"
      - "Acquisition (novos/baixo share): onboarding excelente, primeiros resultados rápidos"
      - "Revisão trimestral: reclassificar contas conforme comportamento"
    aplicacao: "Gestão trimestral de base de clientes existentes"
    dominios:
      - "account management"
      - "retenção"
      - "crescimento de conta"
    fontes: ["UHTC-0009"]

  - id: "JH-FW-015"
    titulo: "Money Tree Framework - Roots → Mindset → Strategy → Tactics"
    descricao: |
      Framework de desenvolvimento profissional em vendas de alto ticket estruturado
      como uma árvore: Raízes (motivadores fundamentais - ninguém te deve nada,
      controle dos dados), Tronco (mindsets - curiosidade, melhoria sistemática),
      Galhos (estratégias - prospecção, follow-up, scripts), Folhas (táticas -
      video prospecting, templates específicos).
    peso: 0.91
    componentes:
      - "Roots (Motivadores): 'ninguém me deve nada' + 'controle meus dados'"
      - "Mindset (Tronco): curiosidade constante + melhoria sistemática"
      - "Strategy (Galhos): prospecção multicanal, follow-up de valor, account management"
      - "Tactics (Folhas): video prospecting, email templates, scripts específicos"
      - "Princípio: sem raízes sólidas, galhos e folhas não sustentam"
    aplicacao: "Desenvolvimento de vendedores e closers de alto ticket"
    dominios:
      - "desenvolvimento profissional"
      - "mentalidade"
      - "vendas"
    fontes: ["UHTC-0003"]

  - id: "JH-FW-016"
    titulo: "Video Prospecting Framework - Packed Pipeline em 60 Dias"
    descricao: |
      Sistema para construir um pipeline cheio em 60 dias usando video prospecting
      como diferenciador. Inclui estrutura de video resume, personalização por
      target, seguência de follow-up com vídeo, e integração com pesquisa de empresa.
      O framework resolve o problema de prospects que levam 5-6 meses para fechar,
      acelerando o ciclo com presença visual e personalização.
    peso: 0.92
    componentes:
      - "Video Resume: apresentação profissional em vídeo de 60-90 segundos"
      - "Personalização: referência específica ao negócio do prospect no vídeo"
      - "Pesquisa de empresa: contexto antes do vídeo para personalização real"
      - "Follow-up em vídeo: respostas a perguntas em formato de vídeo selfie"
      - "Cadência: vídeo inicial + 2-3 follow-ups em vídeo nos primeiros 30 dias"
    aplicacao: "Equipes de B2B sales targeting high-ticket clients"
    dominios:
      - "prospecção"
      - "vendas B2B"
      - "video marketing"
    fontes: ["UHTC-0003"]
