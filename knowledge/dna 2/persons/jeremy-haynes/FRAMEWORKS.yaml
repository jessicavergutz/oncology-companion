  # ═══════════════════════════════════════════════════════════════
  # PAID MEDIA FRAMEWORKS
  # ═══════════════════════════════════════════════════════════════

  - id: "JH-FW-001"
    titulo: "Hydra Strategy - Lead Form Before VSSL"
    descricao: |
      Estrutura de funil onde o prospect preenche um formulário de qualificação
      ANTES de ver o VSSL (Video Sales Letter). O nome vem da ideia de múltiplas
      cabeças - vários pontos de captura e qualificação antes do contato de vendas.
      TypeForm captura dados, Calendly automatiza o agendamento. Resultado: leads
      chegam para o closer pré-qualificados e comprometidos (99% booking rate).
    peso: 0.97
    componentes:
      - "TypeForm: questionário de qualificação (budget, situação atual, objetivo)"
      - "Calendly: agendamento automático integrado com TypeForm"
      - "VSSL: aparece APÓS preenchimento do formulário, não antes"
      - "Hammer Strategy: protocolo de confirmação de call para reduzir no-shows"
    aplicacao: "Funis de call booking para serviços high-ticket ($5K+/mês)"
    dominios:
      - "paid media"
      - "funil de vendas"
      - "qualificação de leads"
    fontes: ["CONFIG"]

  - id: "JH-FW-002"
    titulo: "Venus Fly Trap 1.0 - 3-Video Content Funnel"
    descricao: |
      Funil de conteúdo em 3 vídeos projetado para atrair e converter prospects
      de alto ticket. Funciona como uma Venus Fly Trap: atrai com valor, captura
      com comprometimento, fecha na terceira interação. Cada vídeo serve um papel
      específico: conscientização, consideração, decisão. Os vídeos criam uma jornada
      de nurturing que qualifica o prospect naturalmente antes do contato de vendas.
    peso: 0.95
    componentes:
      - "Vídeo 1 (Awareness): Problem awareness - identifica o problema que o prospect tem"
      - "Vídeo 2 (Consideration): Solution introduction - apresenta a categoria de solução"
      - "Vídeo 3 (Decision): Offer specific - apresenta a oferta e CTA de agendamento"
    aplicacao: "Campanhas de nurturing para high-ticket com ciclo de decisão mais longo"
    dominios:
      - "paid media"
      - "content marketing"
      - "nurturing"
    fontes: ["CONFIG"]

  - id: "JH-FW-003"
    titulo: "Venus Fly Trap 2.0 - Versão Otimizada do 3-Video Funnel"
    descricao: |
      Evolução do Venus Fly Trap 1.0 com aprimoramentos baseados em dados de
      performance. A versão 2.0 incorpora targeting mais sofisticado, retargeting
      estruturado entre vídeos, e triggers de conversão mais específicos.
      Otimizado para plataformas com algoritmos mais avançados (Facebook, Instagram 2.0+).
    peso: 0.93
    componentes:
      - "Sequência de retargeting entre vídeos com audiências de engajamento"
      - "Triggers de conversão baseados em nível de engajamento com vídeos anteriores"
      - "Múltiplas variações criativas para anti-fadiga dentro da sequência"
      - "Integração com Hydra Strategy no ponto de conversão"
    aplicacao: "Campanhas de high-ticket com budget de teste acima de $1K/dia"
    dominios:
      - "paid media"
      - "retargeting"
      - "funil avançado"
    fontes: ["CONFIG"]

  - id: "JH-FW-004"
    titulo: "Andromeda Adaptation - Sistema de 50+ Criativos por Semana"
    descricao: |
      Framework de produção de criativos em volume industrial para combater ad
      fatigue. O nome vem da ideia de expansão constante - como a galáxia de
      Andromeda em expansão perpétua. O sistema cria um pipeline de criativos
      onde novos assets entram continuamente, e o algoritmo sempre tem material
      fresco para otimizar. 50+ criativos/semana é o mínimo para escala real.
    peso: 0.94
    componentes:
      - "Brief templates padronizados para briefar criativos em volume"
      - "Network de freelancers criativos (gráficos, vídeo, animação)"
      - "Sistema de aprovação rápida para não criar gargalo de revisão"
      - "Categorização de criativos por tipo, ângulo e formato para análise"
      - "Protocolo de teste A/B sistemático de novos criativos"
    aplicacao: "Quando budget diário supera $500/dia e ad fatigue começa a ser detectada"
    dominios:
      - "paid media"
      - "criativos"
      - "escala"
    fontes: ["CONFIG"]

  - id: "JH-FW-005"
    titulo: "Tornado / Harvester / Forester - Estratégias de Ad Scaling"
    descricao: |
      Três estratégias distintas de escala de anúncios para diferentes fases do
      crescimento de conta. Tornado: escala agressiva e rápida de ads que estão
      performando (capturar janela de oportunidade). Harvester: colheita sistemática
      de audiências de alto valor que já demonstraram interesse. Forester: plantio
      de sementes de longo prazo em audiências frias para awareness futuro.
    peso: 0.93
    componentes:
      - "Tornado: identificar ad vencedor → escalar budget 2x a 3x por dia"
      - "Harvester: mapear audiências que engajaram → retargeting estruturado"
      - "Forester: campanhas de awareness com objetivo de longo prazo"
      - "Timing: Tornado para spikes, Harvester para consistência, Forester para sustentabilidade"
    aplicacao: "Gestão de contas de paid media em diferentes estágios de maturidade"
    dominios:
      - "paid media"
      - "ad scaling"
      - "estratégia de budget"
    fontes: ["CONFIG"]

  # ═══════════════════════════════════════════════════════════════
  # SALES & FUNNEL FRAMEWORKS
  # ═══════════════════════════════════════════════════════════════

  - id: "JH-FW-006"
    titulo: "DSL - Deck Sales Letter (Alternativa ao VSL)"
    descricao: |
      Sales Letter em formato de apresentação/deck (slides) em vez de vídeo.
      Resultados comprovados: 77% dos visitantes chegam ao slide 5, contra 5-9%
      que completam um VSL. O DSL funciona melhor para audiências que preferem
      controlar o ritmo de consumo. Cada slide tem função específica no processo
      persuasivo, espelhando a estrutura de uma call de vendas.
    peso: 0.96
    componentes:
      - "Slide 1: Hook - problema que ressoa com audiência alvo"
      - "Slide 2-3: Agitação do problema e custo de não resolver"
      - "Slide 4: Apresentação de solução única"
      - "Slide 5: Prova social e credibilidade (77% chegam aqui)"
      - "Slide 6-7: Breakdown da oferta e valor"
      - "Slide 8: CTA e call booking"
    aplicacao: "Página de vendas principal para funis de high-ticket"
    dominios:
      - "copywriting"
      - "funil de vendas"
      - "conversão"
    fontes: ["CONFIG"]

  - id: "JH-FW-007"
    titulo: "Follow-Up Architecture - Little Things → Big Things → Break Glass"
    descricao: |
      Sistema de follow-up em 3 camadas de escalada para reativar prospects parados.
      Layer 1 (Little Things): conteúdo de valor leve e regular (artigos, notícias).
      Layer 2 (Big Things): entrega de value maior (case study, conexão com cliente,
      podcast). Layer 3 (Break Glass): ação de última instância para prospects
      de alto valor que não respondem (chamada direta, oferta especial limitada).
    peso: 0.95
    componentes:
      - "Little Things: artigos de newsroom das plataformas, atualizações relevantes"
      - "Big Things: case studies, vídeos selfie personalizados, testimonials, podcasts"
      - "Break Glass: scarcity real (aumento de preço), conexão com cliente existente"
      - "Cadência: Little Things 1x/semana, Big Things a cada 2 semanas, Break Glass 1x/mês"
    aplicacao: "Gestão de pipeline de prospects que não avançaram após first contact"
    dominios:
      - "follow-up"
      - "vendas"
      - "pipeline management"
    fontes: ["JH-ST-0008", "CONFIG"]

  - id: "JH-FW-008"
    titulo: "Call Funnel Optimization - TypeForm + Calendly + Hammer"
    descricao: |
      Sistema otimizado de booking de calls em 3 componentes integrados.
      TypeForm qualifica o prospect antes do agendamento (filtro de qualidade).
      Calendly automatiza o scheduling e elimina fricção de coordenação.
      Hammer Strategy é o protocolo de confirmação e reforço pré-call para
      garantir presença (99% booking rate reportado com o sistema completo).
    peso: 0.95
    componentes:
      - "TypeForm: 5-7 perguntas de qualificação (situação atual, objetivo, budget, timeline)"
      - "Calendly: integrado com TypeForm, mostra disponibilidade em real time"
      - "Confirmação automática: email + SMS imediatamente após booking"
      - "Hammer Strategy: sequência de lembretes 24h, 1h antes da call"
      - "Protocolo de no-show: tentativa de reagendamento imediata"
    aplicacao: "Configuração padrão de agendamento de calls para ofertas high-ticket"
    dominios:
      - "automação"
      - "funil de vendas"
      - "gestão de calls"
    fontes: ["CONFIG"]

