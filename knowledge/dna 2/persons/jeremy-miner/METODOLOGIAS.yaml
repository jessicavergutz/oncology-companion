        acao: "'Voce sente que isso poderia ser o que voce esta buscando?'"
        palavra_chave: "FEEL — nao THINK"

      - ordem: 3
        nome: "Self-Persuasion Trigger"
        acao: "'Por que voce sente que sim?'"
