  - id: "MET-JM-021"
    nome: "7-Figure Warm Lead Call Opening Methodology"
    descricao: "Metodologia de 6 passos para ligar para leads que responderam a anuncios. Inclui os erros do vendedor medio como contraste e os passos corretos do vendedor de 7 figuras."

    passos:
      - ordem: 1
        nome: "Apresentacao Relaxada"
        acao: "'Oi [nome], aqui e [seu nome]...'"
        tonalidade: "Relaxada, conversacional — como se estivesse ligando para um amigo"

      - ordem: 2
        nome: "Nome da Empresa"
        acao: "'...da [empresa]...'"
        tonalidade: "Casual, nao corporativo"

      - ordem: 3
        nome: "Referencia ao Anuncio — Lembrar Que ELES Pediram"
        acao: "'Parece que voce respondeu a um anuncio ontem sobre [topico especifico]...'"
        objetivo: "Contextualizar — eles pediram esse contato, nao e uma invasao"

      - ordem: 4
        nome: "Verificacao de Momento Apropriado"
        acao: "'E um momento apropriado para conversar?'"
        nota: "Vendedores medios PULAM este passo e entram em pitch — cria resistencia imediata"

      - ordem: 5
        nome: "Verificacao de Status — Ainda Buscando"
        acao: "'Voce ja encontrou o que estava procurando ou ainda esta buscando?'"
        estatistica: "99% ainda estao buscando"
        objetivo: "Confirmar abertura para continuar"

      - ordem: 6
        nome: "Transicao para Discovery com Downplay"
        acao: "'Antes de entrar em quem somos e o que fazemos e todo esse assunto chato... seria mais util se eu soubesse um pouco mais sobre voce e o que voce esta buscando para ver se poderimos ajudar.'"
        objetivo: "Transicionar para NEPQ discovery — downplay ativa resgate"

