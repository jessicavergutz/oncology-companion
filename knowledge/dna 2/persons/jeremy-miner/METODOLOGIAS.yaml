  - id: "MET-JM-005"
    nome: "Objection Diffusing Methodology"
    descricao: "3 passos para difundir objecoes sem confronto"

    passos:
      - ordem: 1
        nome: "Clarify"
        acoes:
          - "O que voce quer dizer com isso?"
          - "Pode me dar mais detalhes?"
          - "Quando voce diz [X], o que especificamente voce quer dizer?"
        tonalidade: "Curious/Confused"
        objetivo: "Entender objecao REAL"
        nota: "99% dos vendedores PULAM este step"

      - ordem: 2
        nome: "Discuss"
        acoes:
          - "Se pudessemos resolver isso, o que significaria?"
          - "Como isso se encaixa no que voce esta procurando?"
          - "Explore as implicacoes juntos"
        tonalidade: "Concerned"
        objetivo: "Deixar prospect processar"

      - ordem: 3
        nome: "Diffuse"
        acoes:
          - "Use evidencias, nao argumentos"
          - "Share similar cases"
          - "Validate then resolve"
        tonalidade: "Empathetic"
        objetivo: "Resolver com credibilidade, nao pressao"

    principio: "10x melhor PREVENIR objecoes do que manejar"

    evidencias:
      - citacao: "3-step objection diffusing: Clarify-Discuss-Diffuse"
        source_id: "JM-0060"

    dominios:
      - "objections"
      - "diffusing"
      - "methodology"

    peso: 0.94

