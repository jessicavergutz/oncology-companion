  - id: "MET-JM-020"
    nome: "Want to Look Around / Compare Methodology"
    descricao: "Metodologia de 4 passos para quando o prospecto diz que quer comparar com outros fornecedores. Transforma a comparacao em descoberta do hot button de decisao."

    passos:
      - ordem: 1
        nome: "Validacao Nao-Defensiva"
        acao: "'Sim, sem problema.' (pausa — nao explicar nada)"
        objetivo: "Nao disparar defensividade"

      - ordem: 2
        nome: "Descoberta de Expectativa"
        acao: "'O que voce esta esperando que essas outras empresas te mostrem?'"
        objetivo: "Entender o que o prospect esta realmente buscando"

      - ordem: 3
        nome: "Hot Button Discovery Question"
        acao: "'Digamos que todas as empresas atendam seus criterios de preco e funcionalidades — como voce decidiria entao com quem ir?'"
        objetivo: "A resposta = o criterio de decisao REAL = o hot button"
        nota: "Fechar em cima do hot button que eles revelam"

      - ordem: 4
        nome: "Confirm Their Hot Button"
        acao: "Demonstrar especificamente como voce atende ao criterio de decisao que eles revelaram na pergunta 3"
        objetivo: "Fechar a venda no criterio deles, nao no criterio seu"

