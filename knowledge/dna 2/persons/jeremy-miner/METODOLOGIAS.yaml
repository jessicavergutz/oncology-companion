  - id: "MET-JM-025"
    nome: "Sell the Exit — Metodologia de Pre-Frame para Envio de Material"
    descricao: "Antes de enviar qualquer material, usar perguntas de pre-frame que criam comprometimento sobre o que o prospect vai buscar no material e quando vai revisar. Elimina o fenomeno 'manda info → nunca mais responde'."

    passos:
      - ordem: 1
        nome: "Aceitar o Pedido"
        acao: "Aceitar o pedido de material sem questionamento"
        objetivo: "Nao criar resistencia"

      - ordem: 2
        nome: "Sell the Exit — O Que Eles Esperam Ver"
        acao: "'O que voce esta esperando ver nessas informacoes que te ajudaria a tomar uma decisao?'"
        objetivo: "Descobrir o hot button ANTES de enviar — permite customizar o material"

      - ordem: 3
        nome: "Timing Commitment"
        acao: "'Quando voce acha que tera tempo de olhar isso para que eu saiba quando entrar em contato?'"
        objetivo: "Criacao de compromisso de tempo especifico"

      - ordem: 4
        nome: "Calendario do Follow-Up"
        acao: "Agendar follow-up no momento especifico que eles indicaram"
        objetivo: "O proximo contato esta confirmado ANTES de enviar o material"

      - ordem: 5
        nome: "Enviar Material Customizado"
        acao: "Enviar apenas o material relevante ao hot button identificado na pergunta 2"
        objetivo: "Material relevante tem 10x mais chance de ser lido"

    principio: "9/10 que pedem 'envie info' nunca retornam — pre-frame antes de enviar"

    evidencias:
