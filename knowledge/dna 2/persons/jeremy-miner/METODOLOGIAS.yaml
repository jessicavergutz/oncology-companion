        nome: "Receive Second Truth"
        acao: "Escutar enquanto segunda verdade emerge"
        exemplo: "'Well, actually... there are some things we'd change'"
        nota: "99% contradizem primeira resposta"

      - ordem: 6
        nome: "Explore Second Truth"
        acao: "Probing questions para aprofundar"
        objetivo: "Expandir em cima da verdade real"

