        nome: "Ask Initial Question"
        acao: "Pergunta sobre situacao atual"
        exemplo: "How are things going with your current provider?"

      - ordem: 2
        nome: "Receive First Truth"
        acao: "Aceitar primeira resposta (protegida)"
