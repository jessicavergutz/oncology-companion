  - id: "MET-JM-016"
    nome: "Confused Old Man Cold Call Methodology — Porta-a-Porta e Visitacao"
    descricao: "Metodologia completa de reducao de resistencia para visitas nao anunciadas (porta-a-porta ou visita fria B2B). Inclui preparacao visual, abertura comportamental e sequencia de perguntas que criam curiosidade em vez de defensividade."

    passos:
      - ordem: 1
        nome: "Preparacao Visual"
        acoes:
          - "Roupas casuais sem marcadores de status (relogio barato, sem gravata ou terno)"
          - "Colete de construcao laranja/verde-limao OR prancheta com formulario de pesquisa"
          - "Fita metrica pendurada na cintura (home security/utilities)"
          - "Objetivo: parecer pesquisador/verificador, nao vendedor"

      - ordem: 2
        nome: "Posicionamento Fisico"
        acoes:
          - "Ficar mais afastado da porta que o normal"
          - "Olhar ao redor como se estivesse tomando notas/verificando algo"
          - "Postura: neutro, nao confrontacional"
          - "Resultado: prospecto tem curiosidade, nao defensividade"

      - ordem: 3
        nome: "Abertura com Confusao Deliberada"
        acao: "Ahhh... sao voces os donos aqui?"
        tonalidade: "Confuso, incerto"
        resultado: "Instinto de ajudar ativa, nao instinto de resistir"

      - ordem: 4
        nome: "Trigger de Curiosidade"
        acao: "Deixar a resposta deles criar a pergunta para voce — nao dar pitch"
        objetivo: "Curiosidade no lugar de resistencia"

      - ordem: 5
        nome: "Transition para Problem Statement"
        acao: "Mencionar o problema/consequencia que sua solucao resolve — como pesquisador encontrando um dado"
        exemplo: "'Sim, estou verificando casas na area sobre [problema]. Voces tem tido alguma situacao de [problema]?'"

    resultado_esperado: "Reducao de 80-90% de resistencia imediata"

