      - "persistence"
      - "methodology"

    peso: 0.89

  - id: "MET-JM-015"
    nome: "Gatekeeper to Decision-Maker Methodology"
    descricao: "Como passar pelo gatekeeper e chegar ao decisor"

    passos:
      - ordem: 1
        nome: "Pattern Interrupt Opening"
        acao: "I was wondering if you could possibly help me out for a moment?"
        objetivo: "Ativar instinto de ajuda"

      - ordem: 2
        nome: "Pause for Response"
        acao: "Esperar 3 segundos"
        resultado: "'Sure, how can I help?'"

      - ordem: 3
        nome: "Position as Ally"
        acao: "I'm trying to get to the right person..."
