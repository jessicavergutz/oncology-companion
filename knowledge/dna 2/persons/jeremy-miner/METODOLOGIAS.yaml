  - id: "MET-JM-018"
    nome: "Competitor Cheaper Handling Methodology — Tratar Concorrente Mais Barato"
    descricao: "Metodologia completa de 6 passos para quando o prospecto recebe uma cotacao menor de um concorrente. Nao compete no preco — compete no resultado e move a conversa do custo para o valor."

    passos:
      - ordem: 1
        nome: "Validacao Sem Defensividade"
        acao: "Sem problema. (pausa)"
        objetivo: "Nao demonstrar ameaca — desarmar"

      - ordem: 2
        nome: "Investigacao do Orcamento Especifico"
        acao: "'Posso perguntar o que exatamente eles cotaram e para que especificamente?'"
        objetivo: "Entender o que esta incluido/excluido"

      - ordem: 3
        nome: "Analise Comparativa Detalhada"
        acao: "'Pode ir atraves da proposta deles comigo especificamente para que eu entenda o que esta sendo oferecido?'"
        objetivo: "Encontrar o gap entre o que cheap oferece e o que o prospect precisa"

      - ordem: 4
        nome: "Reframe Preco → Resultado"
        acao: "'O preco e o mais importante para voce ou resolver o problema e obter o resultado que voce quer?'"
        objetivo: "Mover conversa de custo para valor"

      - ordem: 5
        nome: "3-Option Presentation"
        acoes:
          - "Opcao barata (preco concorrente): listar o que NAO esta incluido, por que nao resolve o problema real"
          - "Opcao intermediaria: mostrar diferencas"
          - "Opcao premium (sua): mostrar ROI e resultado completo"

      - ordem: 6
        nome: "Inversao de Custo"
        acao: "'Se voce pensar bem — qual e o mais caro?'"
        tonalidade: "Curiosa, nao manipuladora"
        objetivo: "Prospect percebe que o barato pode custar mais a longo prazo"

    evidencias:
      - citacao: "Competitor cheaper handling: validate-investigate-analyze-reframe-3options-invert"
        source_id: "JM-0125"

    dominios:
      - "objections"
      - "price"
      - "methodology"

    peso: 0.91

  - id: "MET-JM-019"
    nome: "Pray About It / Spiritual Objection Methodology"
    descricao: "Metodologia para lidar com objecoes de natureza espiritual ou religiosa ('preciso rezar sobre isso'). Nao briga com a crenca — usa a propria crenca do prospecto para criar comprometimento."

    passos:
      - ordem: 1
        nome: "Validacao Total"
        acao: "'Sim, sem problema, claro.' (tom genuinamente empatico)"
        importante: "NAO usar 'sim, MAS...' — dispara resistencia"

      - ordem: 2
        nome: "Clarificacao da Objecao Real"
        acao: "'Agora, quando voce diz que precisa rezar — que partes especificas do que conversamos voce sente que realmente precisa rezar?'"
        tonalidade: "Curiosa e empatica — enfatizar 'realmente precisa rezar sobre'"
        resultado: "Em 100% dos casos, a objecao REAL emerge (dinheiro, tempo, medo)"

      - ordem: 3
        nome: "Resolver Objecao Real"
        acao: "Enderacar diretamente o concern real que emergiu (nao a objecao espiritual de superficie)"
        nota: "Seguir processo padrao de tratamento de objecao para o concern real"

      - ordem: 4
        nome: "Reconectar com o Espiritual"
        acao_b2c: "'Como voce sente que Deus se sentiria sobre voce [obter o resultado que eles disseram querer]?'"
        acao_b2b: "'Como voce sente que Deus se sentiria sobre voces [obter resultado de negocio especifico que mencionaram]?'"
        tonalidade: "Voz mais baixa, empatica, inclinando-se para frente"
        resultado: "99% dos casos nunca dizem que Deus nao quer que eles obtenham o resultado positivo"

    principio: "Usar a crenca do prospecto, nao lutar contra ela"

