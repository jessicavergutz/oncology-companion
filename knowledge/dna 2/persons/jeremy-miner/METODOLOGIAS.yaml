  - id: "MET-JM-014"
    nome: "Follow-Up Value Sequence Methodology"
    descricao: "Como fazer follow-up sem ser irritante - 80% das vendas apos 5o contato"

    passos:
      - ordem: 1
        nome: "First Follow-Up"
        timing: "24-48 horas"
        conteudo: "Recap de conversation + recurso relevante"
        objetivo: "Adicionar valor, nao pressionar"

      - ordem: 2
        nome: "Second Follow-Up"
        timing: "3-5 dias"
        conteudo: "Case study ou testimonial relevante"
        objetivo: "Social proof sem pedir decisao"

      - ordem: 3
        nome: "Third Follow-Up"
        timing: "7-10 dias"
        conteudo: "Artigo/conteudo sobre problema deles"
        objetivo: "Demonstrar que entende problema"

      - ordem: 4
        nome: "Fourth Follow-Up"
        timing: "14-21 dias"
        conteudo: "Check-in genuino sobre situacao"
        objetivo: "Mostrar interesse, nao desespero"

      - ordem: 5
        nome: "Fifth+ Follow-Up"
        timing: "30+ dias"
        conteudo: "Novidade relevante ou mudanca na oferta"
        objetivo: "Razao legitima para reconectar"

    principio: "9/10 que pedem 'envie info' nunca retornam - follow-up com valor"

    evidencias:
      - citacao: "80% of sales happen after 5th contact"
        source_id: "JM-0080"

    dominios:
