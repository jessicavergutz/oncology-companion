  - id: "MET-JM-017"
    nome: "Off-The-Record Unlock Methodology — Desbloquear Prospecto Fechado"
    descricao: "Metodologia de dois pontos de aplicacao para desbloquear prospectos que nao estao se abrindo. Usa a criacao de um espaco psicologico de confidencialidade que convida honestidade."

    passos:
      - ordem: 1
        nome: "Detectar Resistencia"
        acoes:
          - "Prospecto da respostas monossilabicas"
          - "Prospecto confirma tudo mas sem elaborar"
          - "Energia baixa, sem engajamento emocional"

      - ordem: 2
        nome: "Lean-In Fisico"
        acao: "Aproximar-se fisicamente ou se inclinar para frente — mesmo em Zoom"
        objetivo: "Sinalizar que o que vem e privado/especial"

      - ordem: 3
        nome: "Primeira Aplicacao — Durante Discovery"
        acao: "'Entre voce e eu, e fora do registro — qual e a razao principal pela qual voce esta buscando [resultado desejado]?'"
        tonalidade: "Confidencial, curiosa"
        quando: "Quando prospect nao esta se abrindo durante discovery"

      - ordem: 4
        nome: "Segunda Aplicacao — Ultima Chance"
        acao: "'Entre voce e eu, fora do registro — o que esta realmente te segurando de avancar para conseguir [resultado desejado]?'"
        tonalidade: "Empatica, preocupada"
        quando: "Quando prospect nao esta fechando e nenhuma outra tecnica funcionou"

    principio: "Off the record = permissao para ser honesto sem consequencias"

