        nota: "NAO desafiar diretamente"

      - ordem: 3
        nome: "Validate"
        acao: "Parece que as coisas estao indo bem para voce..."
        tonalidade: "Acknowledging, not challenging"

      - ordem: 4
        nome: "Trigger Question"
        acao: "...tem alguma coisa que voce mudaria se pudesse?"
