  - id: "MET-JM-007"
    nome: "Negative Review Reframe Methodology"
    descricao: "5 passos para neutralizar objecao 'vi reviews negativos'"

    passos:
      - ordem: 1
        nome: "Clarify"
        acao: "O que voce viu especificamente?"
        objetivo: "Entender fonte e conteudo"

