  - id: "MET-JM-022"
    nome: "Emotional Word Repetition Deep Probing Methodology"
    descricao: "Metodologia de probing profundo baseada na repeticao das proprias palavras emocionais do prospecto como perguntas. Quando o prospecto usa uma palavra emocional, repeti-la como pergunta os faz automaticamente expandir e aprofundar."

    passos:
      - ordem: 1
        nome: "Detectar Palavra Emocional"
        acoes:
          - "Escutar ativamente palavras carregadas emocionalmente"
          - "Exemplos: 'frustrado', 'sobrecarregado', 'empolgado', 'preocupado', 'exausto'"
          - "Essas palavras sao ouro — o prospect revelou estado emocional real"

      - ordem: 2
        nome: "Reflexao como Pergunta — Eco"
        acao: "Repetir apenas a palavra emocional com tom curioso/confuso"
        exemplo: "Prospect: 'Eu estou muito frustrado com isso.' → Voce: 'Frustrado?'"
        tonalidade: "Curiosa, empatica — nao robotica"

      - ordem: 3
        nome: "Silencio Estrategico"
        acao: "Fazer pausa de 3-7 segundos apos a repeticao"
        objetivo: "Deixar o silencio trabalhar — o prospect vai preencher"

      - ordem: 4
        nome: "Escuta Ativa Expandida"
        acao: "O prospect vai elaborar automaticamente sobre a emocao — escutar sem interromper"
        resultado: "Prospect revela camada mais profunda de dor"

      - ordem: 5
        nome: "Probing de Duracao"
        acao: "'Quanto tempo voce tem se sentido assim?'"
        objetivo: "Estabelecer cronicidade — dor mais antiga = urgencia maior"

      - ordem: 6
        nome: "Probing de Impacto"
        acao: "'Isso tem tido um... impacto em voce?' (pausar antes de 'impacto')"
        objetivo: "A pausa antes de 'impacto' faz o prospect processar profundamente"

    principio: "Perguntas nao sao necessarias — a repeticao da palavra emocional ja e a pergunta"

    evidencias:
      - citacao: "Emotional word repetition deep probing methodology"
        source_id: "JM-0080"

    dominios:
      - "probing"
      - "discovery"
      - "methodology"

    peso: 0.93

  - id: "MET-JM-023"
    nome: "Commitment Questions Extended Sequence — Versao Estendida com 'Would That Be Appropriate'"
    descricao: "Versao estendida das Commitment Questions (MET-JM-013) com passos adicionais de comprometimento progressivo e a pergunta final 'would that be appropriate' que transfere controle ao prospect."
    nota: "MET-JM-013 cobre as 3 perguntas base. Esta metodologia cobre a SEQUENCIA COMPLETA incluindo comprometimento progressivo durante a apresentacao."

    passos:
      - ordem: 1
        nome: "Checking Agreement durante Apresentacao"
        acao: "Fazer micro-perguntas de confirmacao durante apresentacao: 'Faz sentido?' / 'Isso se encaixaria no que voce estava buscando?'"
        objetivo: "Construir micro-comprometimentos antes do comprometimento final"

