<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back2me Global | VSL Preview</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vsl-player" class="vsl-container">
        <!-- SCENES -->
        <div class="scene active" id="scene-1">
            <img src="assets/scene1.png" alt="Silence">
            <div class="overlay"></div>
        </div>
        <div class="scene" id="scene-2">
            <img src="assets/scene2.png" alt="Technology">
            <div class="overlay"></div>
        </div>
        <div class="scene" id="scene-3">
            <img src="assets/scene3.png" alt="Alert">
            <div class="overlay"></div>
        </div>
        <div class="scene" id="scene-4">
            <img src="assets/scene4.png" alt="Reunion">
            <div class="overlay"></div>
        </div>

        <!-- SUBTITLES & AUDIO SIMULATION -->
        <div class="subtitles-container">
            <p id="subtitle-text">Pausado. Clique para iniciar a experiência.</p>
        </div>

        <!-- CONTROLS -->
        <div class="vsl-controls">
            <button id="play-btn" class="play-btn">▶ INICIAR VSL</button>
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
        </div>

        <!-- WATERMARK -->
        <div class="watermark">BACK2ME GLOBAL | CINEMATIC PREVIEW</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
